<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aseguradoras</title>
    <meta name="description" content="Elige aseguradora para ver zona que cubrimos">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="icon-wrapper">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 2L3 6V11.5C3 16.99 6.88 22.09 12 23.5C17.12 22.09 21 16.99 21 11.5V6L12 2ZM12 11.1H19C18.57 15.15 15.7 18.8 12 20.08V11.1H5V7.3L12 4.21V11.1Z"
                        fill="#6366f1" />
                </svg>
            </div>
            <h1>Aseguradoras</h1>
            <p class="subtitle">Elige aseguradora para ver zona que cubrimos</p>
        </header>

        <main>
            <div class="dropdown-container">
                <label for="insurance-select" class="visually-hidden">Программа страхования</label>
                <div class="custom-select-wrapper">
                    <select id="insurance-select" class="premium-select">
                        <option value="" disabled selected>Elige aseguradora...</option>
                        <!-- Опции генерируются через JS -->
                    </select>
                </div>
            </div>

            <div id="cities-container" class="cities-container hidden">
                <div id="insurance-description" class="insurance-desc"></div>

                <a href="#" id="image-link" class="image-link hidden">
                    <div class="image-wrapper">
                        <img id="insurance-image" src="" alt="Иллюстрация к страховке">
                        <div class="zoom-indicator">
                            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path>
                            </svg>
                        </div>
                    </div>
                </a>

                <ul id="cities-list" class="cities-list">
                    <!-- Города генерируются через JS -->
                </ul>
            </div>
        </main>
    </div>

    <div id="image-modal" class="modal hidden">
        <button id="modal-close" class="modal-close" aria-label="Закрыть">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
        <div class="modal-content" id="modal-content">
            <img id="modal-image" src="" alt="Полное выставочное изображение">
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
